#
# pacman configuration used while building the migration image.
#
# mkarchiso runs pacstrap against the build host's mirrors. Keeping this file
# minimal avoids pulling in the Omarchy desktop repository, which is not needed
# on the migration medium.
#
[options]
HoldPkg = pacman glibc
Architecture = auto
CheckSpace
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
